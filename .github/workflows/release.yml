name: Release (Windows exe + installer)

# Запуск: создайте тег вида v0.5.6 -> на GitHub появится релиз с установщиком и портативным zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Tests before packaging
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_annimport_core.py
          python tests/test_formats.py
          python tests/test_startup.py
      - name: Build exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "ML IDE" ^
            --exclude-module torch --exclude-module ultralytics --exclude-module tkinter ^
            --icon assets\icon.ico --add-data "assets;assets" ^
            --collect-submodules mlide mlide\__main__.py
      - name: Self-test of the built exe
        shell: pwsh
        run: |
          Start-Process -FilePath "dist/ML IDE/ML IDE.exe" -ArgumentList "--selftest","st.txt" -Wait
          Get-Content st.txt
          if (Select-String -Path st.txt -Pattern "FAIL") { throw "selftest failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          # portable.flag: настройки и скачанные примеры хранятся в папке data рядом с программой (ничего не пишется в реестр)
          Set-Content -Path "dist/ML IDE/portable.flag" -Value "ML IDE portable mode: settings and examples are stored in the data folder next to the program." -Encoding utf8
          Copy-Item README.md "dist/ML IDE/README.md"
          Copy-Item LICENSE "dist/ML IDE/LICENSE"
          Copy-Item THIRD-PARTY-NOTICES.txt "dist/ML IDE/THIRD-PARTY-NOTICES.txt"
          Copy-Item README.en.md "dist/ML IDE/README.en.md"
          $name = "ML-IDE-$($env:GITHUB_REF_NAME.TrimStart('v'))-portable.zip"
          Compress-Archive -Path "dist/ML IDE" -DestinationPath $name
          Remove-Item "dist/ML IDE/portable.flag"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\ML-IDE.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ML-IDE-*-portable.zip
            dist/ML-IDE-*-setup.exe
          generate_release_notes: true
