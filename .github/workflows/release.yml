name: Release (Windows exe)

# Запуск: создайте тег вида v0.2.0 -> на GitHub появится релиз с ML-IDE-windows.zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "ML IDE" ^
            --exclude-module torch --exclude-module ultralytics --exclude-module tkinter ^
            --icon assets\icon.ico --add-data "assets;assets" ^
            --collect-submodules mlide mlide\__main__.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/ML IDE" -DestinationPath ML-IDE-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ML-IDE-windows.zip
          generate_release_notes: true
