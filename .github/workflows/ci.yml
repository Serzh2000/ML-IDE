name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Format / importer round-trip tests
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_formats.py
      - name: Video / duplicates / split tests
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_tools.py
      - name: Portable mode and language test
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_portable.py
      - name: Annotation import tests
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_annimport_core.py
          python tests/test_annimport_json.py
          python tests/test_annimport_xmltxt.py
          python tests/test_import_dialog.py
      - name: Dataset catalog test
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_catalog.py
      - name: Netron viewer server test
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_netron.py
      - name: Smoke test (headless Qt, Russian UI)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python tests/smoke.py
      - name: Smoke test (English UI)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          MLIDE_LANG: en
        run: python tests/test_i18n.py
